name: Publish site

# Publish the collective-intelligence homepage, blog and research archive.
# Repository Pages source: GitHub Actions; custom domain: socaity.dev.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Build exactly the triggering revision. The preview and production jobs both
# consume its immutable artifact; approving production never rebuilds it.
env:
  SOURCE_SHA: ${{ github.sha }}

permissions:
  contents: read

jobs:
  check:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the site dependencies
        run: python -m pip install --quiet -r tools/pages/requirements.txt
      - name: Test folder-based blog publishing
        run: python -m unittest discover -s tools/pages -p 'test_*.py' -v
      - name: Validate the graph (append-only against the base branch)
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            python3 tools/validate/validate.py --root . --base "$BASE"
          else
            python3 tools/validate/validate.py --root .
          fi
      - name: Render twice and prove the build is byte-identical
        run: tools/check.sh
      - name: Read the Pages configuration
        if: github.ref == 'refs/heads/main' && !github.event.repository.fork
        id: pages
        uses: actions/configure-pages@v6

      - name: Assemble the homepage, archive and blog
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          python tools/pages/build.py --archive site --out _pages \
            --base-url "${BASE_URL:-https://socaity.dev/}"

      - name: Verify the production homepage and archive
        run: |
          for file in index.html styles.css app.js; do
            cmp "doc/design/collective-intelligence/$file" "_pages/$file"
          done
          test -s _pages/research.html
          test -s _pages/blog/index.html
          test -s _pages/blog/feed.xml

      - name: Upload the preview site
        uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: _pages/
          retention-days: 14
          include-hidden-files: true

  preview:
    name: Publish live preview
    needs: check
    if: >-
      !github.event.repository.fork &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: publish-preview
      cancel-in-progress: false
    environment:
      name: preview
      url: ${{ format('{0}/revisions/{1}/', vars.PREVIEW_BASE_URL, github.sha) }}
    env:
      PREVIEW_URL: ${{ format('{0}/revisions/{1}/', vars.PREVIEW_BASE_URL, github.sha) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: site-preview
          path: _pages/
      - name: Check out the preview hosting repository
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.PREVIEW_REPOSITORY }}
          ref: main
          ssh-key: ${{ secrets.PREVIEW_DEPLOY_KEY }}
          path: .preview-host
      - name: Publish the immutable revision
        run: |
          python3 tools/pages/preview.py --site _pages --host .preview-host --revision "$SOURCE_SHA"
          git -C .preview-host config user.name 'github-actions[bot]'
          git -C .preview-host config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C .preview-host add -- revisions index.html .nojekyll robots.txt
          if ! git -C .preview-host diff --cached --quiet; then
            git -C .preview-host commit -m "Preview $SOURCE_SHA"
            git -C .preview-host push origin main
          fi
      - name: Verify the live preview matches the artifact
        run: python3 tools/pages/preview.py --site _pages --verify-url "$PREVIEW_URL"
      - name: Link the preview for review
        run: |
          printf '## Live preview\n\n[%s](%s)\n\nReview this revision before approving production.\n' "$SOURCE_SHA" "$PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Promote to production (approval required)
    needs: [check, preview]
    if: github.ref == 'refs/heads/main' && !github.event.repository.fork
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    concurrency:
      group: pages-production
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Reject superseded revisions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          latest="$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)"
          if [[ "$latest" != "$SOURCE_SHA" ]]; then
            echo 'This revision has been superseded. Review and approve the newest main run.'
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: site-preview
          path: _pages/
      - name: Package the reviewed artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _pages/
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  cleanup:
    name: Remove the promoted preview
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    # Share the preview publisher's lock so cleanup cannot overwrite another
    # candidate's publication. Failed/rejected deployments never reach here.
    concurrency:
      group: publish-preview
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check out the current preview host
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.PREVIEW_REPOSITORY }}
          ref: main
          ssh-key: ${{ secrets.PREVIEW_DEPLOY_KEY }}
          path: .preview-host
      - name: Remove the promoted revision and refresh the index
        run: |
          python3 tools/pages/preview.py --remove --host .preview-host --revision "$SOURCE_SHA"
          git -C .preview-host config user.name 'github-actions[bot]'
          git -C .preview-host config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C .preview-host add -A
          if ! git -C .preview-host diff --cached --quiet; then
            git -C .preview-host commit -m "Remove promoted preview $SOURCE_SHA"
            git -C .preview-host push origin main
          fi
      - name: Delete this run's temporary build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh api "repos/$GH_REPO/actions/runs/$RUN_ID/artifacts" --paginate \
            --jq '.artifacts[] | select(.name == "site-preview" or .name == "github-pages") | .id' |
          while read -r artifact; do
            gh api --method DELETE "repos/$GH_REPO/actions/artifacts/$artifact"
          done
