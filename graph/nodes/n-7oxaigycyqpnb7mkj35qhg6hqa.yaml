slug: static-generator-over-yaml-node-files
type: solution
title: Render a static site from the YAML node files
status: open
body: |
  One small Python generator reads graph/nodes/*.yaml and writes a static site:
  one page per node, a roadmap page, an /all index and a graph.json export. The
  site is a pure function of the merged tree, so a fork renders the same pages
  and CI can prove the build is reproducible.
