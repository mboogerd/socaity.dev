# The scheduled worker needs Git metadata writes and remote sync/publishing.
default_permissions = "socaity-work"

[features]
hooks = true

[permissions.socaity-work]
description = "Socaity worker: workspace and Git writes, remote sync and PRs."
extends = ":workspace"

[permissions.socaity-work.filesystem.":workspace_roots"]
".git" = "write"

[permissions.socaity-work.network]
enabled = true
